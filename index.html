        <!DOCTYPE html>
<html>
<head>
    <title>Guess the Number</title>
</head>
<!-- ID toegevoegd aan de body om de kleur aan te passen -->
<body id="gameBody" style="background-color: lightblue; transition: background-color 0.5s ease;">
<center>
    <div style="background-color: white; width: 300px; height: 380px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);"><br> <br>
        <h1>Guess the number</h1>
        <p id="rangeText">I'm thinking of a number between 1 and 100.</p>
        <input id="guessInput" type="number">
        <button id="guessButton">Guess</button>
        <button id="resetButton" style="display: none;">Play Again</button>
        <p id="message"></p>
        <p>Guesses: <span id="guessCount">0</span> / 10</p>
        <p>Best Score: <span id="bestScore">--</span> guesses</p>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let count = 0;
        const maxGuesses = 10;
        
        let minRange = 1;
        let maxRange = 100;

        const gameBody = document.getElementById("gameBody");
        const guessInput = document.getElementById("guessInput");
        const guessButton = document.getElementById("guessButton");
        const resetButton = document.getElementById("resetButton");
        const message = document.getElementById("message");
        const guessCount = document.getElementById("guessCount");
        const bestScoreDisplay = document.getElementById("bestScore");
        const rangeText = document.getElementById("rangeText");

        let bestScore = localStorage.getItem("guessBestScore") ? Number(localStorage.getItem("guessBestScore")) : Infinity;
        if (bestScore !== Infinity) {
            bestScoreDisplay.textContent = bestScore;
        }

        guessInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                guessButton.click();
            }
        });

        guessButton.addEventListener("click", function() {
            const userGuess = Number(guessInput.value);
            if (!userGuess || userGuess < 1 || userGuess > 100) {
                message.textContent = "Please enter a valid number between 1 and 100.";
                message.style.color = "black";
                return;
            }

            count++;
            guessCount.textContent = count;

            if (userGuess === randomNumber) {
                message.textContent = `Correct! You guessed it in ${count} tries.`;
                message.style.color = "green";
                gameBody.style.background = "#2ecc71"; // Groen bij winst
                endGame(true);
            } else if (count >= maxGuesses) {
                message.textContent = `Game Over! The number was ${randomNumber}.`;
                message.style.color = "red";
                gameBody.style.background = "#95a5a6"; // Grijs bij verlies
                endGame(false);
            } else {
                if (userGuess > randomNumber) {
                    message.textContent = "Too high! go cave diving.";
                    message.style.color = "red";
                    if (userGuess < maxRange) maxRange = userGuess - 1;
                } else {
                    message.textContent = "Too low! guess at its PEAK.";
                    message.style.color = "blue";
                    if (userGuess > minRange) minRange = userGuess + 1;
                }
                
                rangeText.textContent = `I'm thinking of a number between ${minRange} and ${maxRange}.`;

                if (count === 3) {
                    const isEven = randomNumber % 2 === 0 ? "EVEN" : "ODD";
                    message.textContent += ` (Psst... the number is ${isEven}!)`;
                }

                // NIEUW: Bereken hoe dichtbij de speler is (Warm/Koud feedback via kleur)
                const verschil = Math.abs(userGuess - randomNumber);
                if (verschil <= 5) {
                    gameBody.style.backgroundColor = "#ff5722"; // Heel warm (Fel oranje-rood)
                } else if (verschil <= 15) {
                    gameBody.style.backgroundColor = "#ff9800"; // Warm (Oranje)
                } else if (verschil <= 30) {
                    gameBody.style.backgroundColor = "#ffeb3b"; // Lauw (Geel)
                } else {
                    gameBody.style.backgroundColor = "#3498db"; // Koud (Blauw)
                }
            }
        });

        function endGame(won) {
            guessInput.disabled = true;
            guessButton.style.display = "none";
            resetButton.style.display = "inline-block";
            
            if (won) {
                if (count < bestScore) {
                    bestScore = count;
                    localStorage.setItem("guessBestScore", bestScore);
                    bestScoreDisplay.textContent = bestScore;
                    message.textContent += " New Best Score!";
                }
            }
        }

        resetButton.addEventListener("click", function() {
            randomNumber = Math.floor(Math.random() * 100) + 1;
            count = 0;
            minRange = 1;
            maxRange = 100;
            
            guessCount.textContent = count;
            message.textContent = "";
            rangeText.textContent = "I'm thinking of a number between 1 and 100.";
            guessInput.value = "";
            guessInput.disabled = false;
            guessButton.style.display = "inline-block";
            resetButton.style.display = "none";
            gameBody.style.backgroundColor = "lightblue"; // Reset achtergrondkleur
        });
    </script>
</center>
</body>
</html>
